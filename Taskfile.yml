version: '3'

tasks:
  lint:
    desc: Run oxlint across the repository
    cmds:
      - bun run lint

  format:
    desc: Format files with oxfmt
    cmds:
      - bun run fmt

  transcribe:
    desc: Transcribe a PDF document page by page
    dotenv: ['.env']
    cmds:
      - bun run packages/pipeline/src/main.ts transcribe {{.CLI_ARGS}}
