default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.5.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "commitlint"
name = "Commitlint"
entry = "bunx commitlint --edit"
language = "system"
stages = ["commit-msg"]

[[repos.hooks]]
id = "oxfmt"
name = "Oxfmt"
entry = "bunx oxfmt --write --no-error-on-unmatched-pattern"
language = "system"
types_or = ["javascript", "jsx", "ts", "tsx", "json", "jsonc"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "oxlint"
name = "Oxlint"
entry = "bunx oxlint --deny-warnings"
language = "system"
types_or = ["javascript", "jsx", "ts", "tsx"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "test"
name = "Tests"
entry = "bun run test"
language = "system"
stages = ["pre-push"]
pass_filenames = false
always_run = true
