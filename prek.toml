default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "oxfmt"
name = "Oxfmt"
entry = "bunx oxfmt --write --no-error-on-unmatched-pattern"
language = "system"
types_or = ["javascript", "jsx", "ts", "tsx", "json", "jsonc"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "oxlint"
name = "Oxlint"
entry = "bunx oxlint --deny-warnings"
language = "system"
types_or = ["javascript", "jsx", "ts", "tsx"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "test"
name = "Tests"
entry = "bun run test"
language = "system"
stages = ["pre-push"]
pass_filenames = false
always_run = true
