name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint commit messages (pull request)
        if: github.event_name == 'pull_request'
        env:
          COMMITLINT_FROM: ${{ github.event.pull_request.base.sha }}
          COMMITLINT_TO: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$COMMITLINT_FROM" --to "$COMMITLINT_TO" --verbose

      - name: Lint commit messages (push)
        if: github.event_name == 'push'
        env:
          COMMITLINT_FROM: ${{ github.event.before }}
          COMMITLINT_TO: ${{ github.sha }}
        run: bunx commitlint --from "$COMMITLINT_FROM" --to "$COMMITLINT_TO" --verbose

      - name: Format, lint, and typecheck
        run: bun run --parallel --no-exit-on-error fmt:check lint ts-check

      - name: Run tests
        run: bun run test

      - name: Build packages
        run: bun run build
